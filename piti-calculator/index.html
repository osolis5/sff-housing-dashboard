<script src="piti.js?v=20260904i"></script>
<script>
  PITI.render(
    document.getElementById('piti-mount'),
    JSON.parse(document.getElementById('piti-data').textContent),
    { dashboard: true }
  );

  // auto-height for iframe embeds (portfolio/Webflow). Measure the content
  // wrap, not documentElement: scrollHeight includes the viewport, which
  // would feed back through the parent's iframe height.
  if (window.parent !== window) {
    const wrap = document.querySelector('.wrap');
    const post = () => parent.postMessage(
      { type: 'piti-height', height: Math.ceil(wrap.getBoundingClientRect().height) }, '*');
    new ResizeObserver(post).observe(wrap);
    addEventListener('load', post);
    post();
  }
</script>
